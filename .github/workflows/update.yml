name: "Update translations"
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump updated
        run: |
          date -u -Iseconds > x/updated
      - uses: actions/upload-artifact@v4
        with:
          name: x
          path: x/
          retention-days: 1
  commit:
    needs: [update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rm -r x/
      - uses: actions/download-artifact@v4
      - run: ls -al
      - name: Commit updates
        run: |
          git config --local user.name 'folio-translations repository bot'
          git config --local user.email 'folio-translations@users.noreply.github.com'
          git add x
          (git commit -m "Update translations" && git push) || true   # ignore failure caused by unchanged files
